<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8d8e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#88c9d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6cb4d8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rippleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8e6c8;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#a8d8e8;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="240" fill="url(#waterGrad)" />
  <!-- 水波纹 -->
  <ellipse cx="256" cy="200" rx="140" ry="20" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5" />
  <ellipse cx="256" cy="260" rx="160" ry="22" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.4" />
  <ellipse cx="256" cy="320" rx="120" ry="16" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />
  <!-- 中心水滴 -->
  <path d="M256 140 C256 140 200 230 200 290 C200 330 224 360 256 360 C288 360 312 330 312 290 C312 230 256 140 256 140Z" fill="#ffffff" opacity="0.85" />
  <!-- 水滴高光 -->
  <ellipse cx="240" cy="230" rx="14" ry="28" fill="#ffffff" opacity="0.6" />
  <!-- 小水珠 -->
  <circle cx="180" cy="180" r="8" fill="#ffffff" opacity="0.5" />
  <circle cx="330" cy="210" r="6" fill="#ffffff" opacity="0.4" />
  <circle cx="300" cy="150" r="5" fill="#ffffff" opacity="0.35" />
  <circle cx="200" cy="370" r="7" fill="#ffffff" opacity="0.3" />
  <circle cx="310" cy="390" r="5" fill="#ffffff" opacity="0.25" />
  <!-- 文字 -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="28" font-weight="600" fill="#ffffff" opacity="0.9">WorkBuddy</text>
</svg>
